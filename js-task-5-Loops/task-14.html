<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<p>Task 14: Restaurant Table Management Display occupied and available tables and count free tables.</p>

    <script>
        let status = "";
        let availableTable = 0;
        let occupiedTable = 0;

        for(i=1; i<=10; i++){            
            status = prompt("Enter the Tabel " + i + " status(av/oc) ")

            if(status==="av"){
                availableTable += 1;

                console.log(`Table ${i} is Available`);
                
            }
            else if(status==="oc"){
                occupiedTable += 1

                console.log(`Table ${i} is Occupied`);
            }
            else{
                console.log("Error Status");
                
            }
        }

        console.log("Available Table: " + availableTable);
        console.log("Occupied Table: " + occupiedTable);
        
    </script>
</body>
</html>
