<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>Task 8: Online Order Tracking Display order status progression until Delivered.</p>
    <script>
        let orderStatus = ""

        for (i = 1; i <= 7; i++) {

            switch (i) {
                case 1:
                    orderStatus = "Your Order has been placed"
                    break;

                case 2:
                    orderStatus = "Your Order has been packed"
                    break;

                case 3:
                    orderStatus = "Your Order has been handed over to warehouse"
                    break;

                case 4:
                    orderStatus = "Your Order has been shipped"
                    break;
                case 5:
                    orderStatus = "Your Order is out for delivery"
                    break;
                case 6:
                    orderStatus = "Your Order is out for delivery"
                    break;
                case 7:
                    orderStatus = "Delivery is successfully completed"
                    break;

                default:
                    break;
            }

            console.log(orderStatus);

        }

        //while loop

        let status = "Ordered"

        while (status !== "Delivered") {

            console.log("Order Status: ", status);

            if (status === "Ordered") {
                status = "Processing"
            }

            else if (status === "Processing") {
                status = "Shipped";
            }
            else if (status === "Shipped") {
                status = "Out for Delivery";
            }
            else if (status === "Out for Delivery") {
                status = "Delivered";
            }
        }
        console.log("Order Status:", status);
        console.log("Order Delivered Successfully");

    </script>
</body>

</html>
