<body>
    <script>
        let password = "Kavi1808";
        let attempt = 3;

        password = prompt("Enter Password")
        while (password !== "Kavi1808" && attempt>0) {

                password = prompt("Enter Password")

            }
        }
        if(password==="Kavi1808"){
            console.log("You Have Successfully Logged in");
            
        }

    </script>
