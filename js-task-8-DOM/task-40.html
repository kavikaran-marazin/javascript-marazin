<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn">Click</button>
    <p id="liveCount">0</p>

    <p id="result">See here Howmany times You clicked the button</p>

    <script>
        let btn = document.getElementById("btn");
        let liveCount = document.getElementById("liveCount")
        let count = 0;

        function countTotal(){
            count ++

            liveCount.textContent = count
        }

        btn.addEventListener("click",countTotal)
    </script>
</body>
</html>
