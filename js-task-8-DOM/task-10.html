<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="dateTime"></div>


    <script>
        let dateTime = document.getElementById("dateTime");

        function updateTIme() {
            let now = new Date()

            dateTime.textContent = now.toLocaleString();
        }
        updateTIme();
        setInterval(updateTIme,1000)
    </script>
</body>

</html>
