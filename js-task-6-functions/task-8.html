    <p>8. Convert Celsius to Fahrenheit
Create a function convertTemperature() that accepts Celsius and converts it to Fahrenheit.</p>

Fahrenheit = (Celsius × 9/5) + 32

<script>
    function convertTemperature(Celsius){
        let Fahrenheit = (Celsius * 9/5) + 32;
        console.log(`Celsius ${Celsius} and the Fahrenheit ${Fahrenheit}`);
        
        return Fahrenheit;
    }
    let answer = convertTemperature(36)
    console.log(answer);
    
</script>
