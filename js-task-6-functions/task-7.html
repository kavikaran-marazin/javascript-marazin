<body>
    <p>7. Calculate Discount
Create a function calculateDiscount() that accepts price and discount percentage and returns the final price
after discount.</p>

<script>
    function calculateDiscount(price,discount){
        discount = discount/100
        let discountAmount = price * discount;
        let finalprice = price - discountAmount;
        return finalprice;
    }

    let answer = calculateDiscount(
        Number(prompt("Enter price")),
        Number(prompt("Enter discount percentage"))
    )
    console.log(answer);
    
</script>
