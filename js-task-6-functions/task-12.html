<body>
    <p>
        12. Find Factorial
        Create a function calculateFactorial() that accepts a number and returns its factorial
    </p>

    <script>

        function calculateFactorial(num) {

            let factorial = 1 

            for (i = num; i > 0; i--) {
                factorial = factorial*i
            }

            return factorial

        }
        let factorial = calculateFactorial(5)
        console.log(factorial);

    </script>
</body>
