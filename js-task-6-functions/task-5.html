<body>
    <p>5. Check Pass or Fail
        Create a function checkResult() that accepts a student's mark. If the mark is 50 or above, return "Pass";
        otherwise return "Fail"</p>

    <script>
        function checkResult(mark) {
            if (mark >= 50) {
                return "Pass";
            }
            else {
                return "Fail";

            }
        }
        let answer = checkResult(80);

        console.log(answer);


    </script>
</body>
