<body>
    <p>
        10. Check Voting Eligibility
Create a function checkEligibility() that accepts a person's age. If the age is 18 or above, return "Eligible to
Vote"; otherwise return "Not Eligible"
    </p>

    <script>
        function checkEligibility(age){
            if(age >= 18){
                return "Eligible to Vote"
            }
            else{
                return "Not Eligible"
            }
        }
        let check = checkEligibility(19)
        console.log(check);
        
    </script>
</body>
