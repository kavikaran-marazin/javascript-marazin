<body>
    <p>11. Calculate Electricity Bill
        Create a function calculateBill() that accepts electricity units and calculates the bill using these rules:
        • 0–60 units fi Rs. 10 per unit
        • 61–120 units fi Rs. 15 per unit
        • Above 120 units fi Rs. 20 per unit
    </p>

    <script>
        function calculateBill(units){
            let amount = 0;

            if(units > 120){
                amount = units * 20
            }
            else if(units>61 && units<=120){
                amount = units * 15
            }
            else if(units>=0 && units<=60){
                amount = units * 10
            }

            return amount;
        }
        let billAmount = calculateBill(130);
        console.log(billAmount);
        
    </script>
</body>
