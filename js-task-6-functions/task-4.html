<body>
    <p>
        4. Calculate Student Average
        Create a function calculateAverage() that accepts marks for 3 subjects and returns the average mark
    </p>

    <script>
        function calculateAverage(mark1,mark2,mark3){
            let totalmarks = mark1+mark2+mark3
            let avg = totalmarks/3

            return avg
        }
        let answer = calculateAverage(40,50,60);
        console.log(answer);
        
    </script>
