    <p>6. Calculate Rectangle Area
Create a function calculateArea() that accepts length and width and returns the area of a rectangle</p>

<script>
    function calculateArea(length,width){
        let area = length*width;
        return area;
    }
    let answer = calculateArea(10,5)
    console.log(answer);
    
</script>
