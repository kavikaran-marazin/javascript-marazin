    <p>2. Check Even or Odd
Create a function checkEvenOdd() that accepts a number and displays whether it is even or odd.</p>

<script>
    function checkEvenOdd(num){
        if(num % 2 == 0){
            console.log("Its Even Number");         
        }

        else{
            console.log("Its Odd");         
        }
    }

    checkEvenOdd(80)
    
</script>
